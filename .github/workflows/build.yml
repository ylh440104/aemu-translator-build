name: build translator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qemu:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools musl-dev build-essential pkg-config \
            meson ninja-build python3 python3-pip bison flex zlib1g-dev linux-libc-dev
          pip3 install --break-system-packages --quiet distlib

      - name: fetch qemu
        run: |
          curl -sSL --retry 5 -o qemu.tar.xz https://download.qemu.org/qemu-8.2.4.tar.xz
          echo "ecf5537feab92641b99d7482f551f2195d3a5bd34acef9d52bfbff353a607397  qemu.tar.xz" | sha256sum -c -
          tar xf qemu.tar.xz

      - name: apply patches
        run: |
          cd qemu-8.2.4
          for p in ../patches/*.patch; do
            patch -p1 -N -r /tmp/rej_$(basename "$p") < "$p" > /tmp/log_$(basename "$p") 2>&1 || true
          done
          echo "rejects: $(ls /tmp/rej_* 2>/dev/null | wc -l)"

      - name: our sources
        run: cp -r src/. qemu-8.2.4/linux-user/

      - name: glib for musl
        run: |
          curl -sSL --retry 5 -o glib.tar.xz https://download.gnome.org/sources/glib/2.80/glib-2.80.4.tar.xz
          tar xf glib.tar.xz
          curl -sSL --retry 5 -o pcre2.tar.bz2 https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.43/pcre2-10.43.tar.bz2
          tar xf pcre2.tar.bz2
          curl -sSL --retry 5 -o zlib.tar.gz https://zlib.net/fossils/zlib-1.3.1.tar.gz
          tar xf zlib.tar.gz
          curl -sSL --retry 5 -o libffi.tar.gz https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
          tar xf libffi.tar.gz
          export PREFIX=$PWD/musl-prefix
          export CC=musl-gcc
          export CFLAGS="-O2 -fPIC"
          cd zlib-1.3.1
          ./configure --static --prefix=$PREFIX >/dev/null
          make -j8 >/dev/null && make install >/dev/null
          cd ..
          cd libffi-3.4.6
          MUSLINCLUDE=$(dirname $(musl-gcc -print-file-name=include))/include
          mkdir -p $PWD/uapi && cp -r /usr/include/linux $PWD/uapi/ 2>/dev/null || true
          cp -r /usr/include/asm-generic $PWD/uapi/ 2>/dev/null || true
          cp -r /usr/include/aarch64-linux-gnu/asm $PWD/uapi/ 2>/dev/null || true
          ./configure CC="musl-gcc -isystem $MUSLINCLUDE -isystem $PWD/uapi" CFLAGS="-O2 -fPIC" --host=aarch64-linux-musl --prefix=$PREFIX --enable-static --disable-shared --disable-docs >/dev/null
          make -j8 >/dev/null && make install >/dev/null
          cd ..
          cd pcre2-10.43
          ./configure --host=aarch64-linux-musl --prefix=$PREFIX --enable-static --disable-shared --disable-docs >/dev/null
          make -j8 >/dev/null && make install >/dev/null
          cd ..
          cd glib-2.80.4
          PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig meson setup _b --prefix=$PREFIX --buildtype=release \
            --default-library=static -Dselinux=disabled -Dlibmount=disabled -Dtests=false \
            -Dglib_debug=disabled -Dc_args="-O2 -fPIC" 2>&1 | tail -10
          ninja -C _b -j8 2>&1 | grep -E 'error:|FAILED' | head -20
          ninja -C _b -j8 2>&1 | tail -3
          ninja -C _b install 2>&1 | tail -3

      - name: build qemu
        run: |
          cd qemu-8.2.4
          mkdir -p build && cd build
          export PREFIX=$PWD/../../musl-prefix
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          CC=musl-gcc CFLAGS="-O2 -fPIC -I$PREFIX/include" LDFLAGS="-L$PREFIX/lib" \
          ../configure --target-list=arm-linux-user --static --disable-system \
            --without-default-features --enable-tcg --disable-plugins \
            --disable-tools --disable-docs --disable-capstone --disable-fdt \
            --disable-libusb --disable-pixman 2>&1 | tail -25
          ninja -j8 qemu-arm 2>&1 | tail -15

      - name: verify
        run: |
          cd qemu-8.2.4/build
          file qemu-arm
          ./qemu-arm --version
          ls -l qemu-arm
          sha256sum qemu-arm | tee /tmp/sum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-arm-static
          path: qemu-8.2.4/build/qemu-arm